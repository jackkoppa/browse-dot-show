# Checks every PR must pass (branch protection requires the `typecheck` and `test` jobs).
# Runs on every PR, with no path filters, so the required check always reports.
name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Packages import each other's built dist/ types
      - run: pnpm all:build
      - run: pnpm all:typecheck

  # Every package's tests (`pnpm all:test`) and the site config checks; they take seconds, so no affected-only filtering
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Packages import each other's built dist/
      - run: pnpm all:build
      - run: pnpm all:test
      # Site configs (`pnpm bds validate sites`): required fields, lengths, theme colors, assets
      - run: pnpm --filter @browse-dot-show/sites validate

  # Terraform formatting (no init, no AWS access). Fix with `terraform fmt -recursive terraform/`
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff terraform/
