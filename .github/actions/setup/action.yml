name: Setup
description: Node (from .nvmrc), pnpm (from packageManager), dependencies and the packages `pnpm bds` needs; optionally Terraform
inputs:
  terraform:
    description: Also install Terraform
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # `pnpm bds` imports workspace packages from their dist/ folders
    - name: Build the CLI's workspace packages
      run: pnpm --filter "@browse-dot-show/scripts^..." build
      shell: bash
    - if: inputs.terraform == 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false
