name: Setup
description: Node (from .nvmrc), pnpm (from packageManager) and dependencies; optionally Terraform
inputs:
  terraform:
    description: Also install Terraform
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.terraform == 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
        terraform_wrapper: false
